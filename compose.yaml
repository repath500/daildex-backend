services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: daildex
      POSTGRES_USER: daildex
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daildex -d daildex"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - daildex-postgres:/var/lib/postgresql/data
volumes:
  daildex-postgres:
